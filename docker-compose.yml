services:

  # ── API (HTTP server) ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: micro-url-server
    restart: unless-stopped
    command: ["node", "server.js"]

    env_file:
      - .env

    environment:
      # "redis" is the shared Redis container on appnet. /1 = database 1,
      # so micro-url never touches Sumora's keys (database 0).
      REDIS_URL: redis://redis:6379/1
      NODE_ENV: production
      PORT: "4000"

    # No "ports:" on purpose. Caddy reaches this over appnet.
    networks:
      - appnet

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Worker (BullMQ background processor) ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: micro-url-worker
    restart: unless-stopped
    command: ["node", "worker.js"]

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/1
      NODE_ENV: production

    networks:
      - appnet

    depends_on:
      api:
        condition: service_healthy

networks:
  appnet:
    external: true
